<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart Disease Risk Predictor</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 10px; font-size: 0.9rem; }
  input { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
  #result { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>
  <h1>Heart Disease Risk Predictor</h1>
  <p>Enter patient clinical parameters to get a prediction.</p>
  <form id="predict-form">
    <label>Age <input type="number" name="age" required></label>
    <label>Sex (1 = male, 0 = female) <input type="number" name="sex" required></label>
    <label>Chest Pain Type (cp, 1-4) <input type="number" name="cp" required></label>
    <label>Resting Blood Pressure (trestbps) <input type="number" name="trestbps" required></label>
    <label>Serum Cholesterol (chol) <input type="number" name="chol" required></label>
    <label>Fasting Blood Sugar &gt; 120 mg/dl (fbs, 1/0) <input type="number" name="fbs" required></label>
    <label>Resting ECG (restecg, 0-2) <input type="number" name="restecg" required></label>
    <label>Max Heart Rate (thalach) <input type="number" name="thalach" required></label>
    <label>Exercise Induced Angina (exang, 1/0) <input type="number" name="exang" required></label>
    <label>ST Depression (oldpeak) <input type="number" step="0.1" name="oldpeak" required></label>
    <label>Slope (1-3) <input type="number" name="slope" required></label>
    <label>Number of Major Vessels (ca, 0-3) <input type="number" name="ca" required></label>
    <label>Thal (0-2) <input type="number" name="thal" required></label>
    <button type="submit">Predict</button>
  </form>
  <div id="result"></div>

<script>
document.getElementById("predict-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const data = {};
  new FormData(form).forEach((v, k) => data[k] = Number(v));

  const res = await fetch("/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  const json = await res.json();
  document.getElementById("result").textContent = json.prediction
    ? `${json.prediction} (risk probability: ${json.risk_probability})`
    : JSON.stringify(json);
});
</script>
</body>
</html>
